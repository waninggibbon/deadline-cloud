name: DCM Smoke Test (Linux)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Git ref (tag/branch/SHA) to test. Defaults to the triggering ref.
        required: false
        type: string
        default: ''

jobs:
  test:
    name: DCM xa11y Smoke (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DISPLAY: ':99'
      GTK_MODULES: gail:atk-bridge
      GTK_A11Y: atk
      GNOME_ACCESSIBILITY: '1'
      ACCESSIBILITY_ENABLED: '1'
      NO_AT_BRIDGE: '0'
      MOZ_ENABLE_WAYLAND: '0'
      # Prevent webkitgtk web process GPU crashes under Xvfb
      WEBKIT_DISABLE_COMPOSITING_MODE: '1'
      WEBKIT_FORCE_SANDBOX: '0'
      LIBGL_ALWAYS_SOFTWARE: '1'
      # Workaround: direct webkitgtk web process to register on session bus
      # instead of the dedicated AT-SPI bus (registryd may not be on the latter)
      XA11Y_USE_SESSION_BUS: '1'
      SCREENSHOT_DIR: /tmp/dcm-screenshots
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 at-spi2-core \
            libayatana-appindicator3-1 libwebkit2gtk-4.0-37 desktop-file-utils \
            libatk-bridge2.0-0 libatspi2.0-0 libgtk-3-0 gir1.2-atspi-2.0 \
            fluxbox

      - name: Start Xvfb + session bus + AT-SPI
        run: |
          # 1. Xvfb first
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 1

          # 2. D-Bus session bus
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV

          # 3. AT-SPI bus launcher (provides org.a11y.Bus on the session bus)
          /usr/libexec/at-spi-bus-launcher --launch-immediately &
          sleep 2

          # 4. AT-SPI registry daemon
          /usr/libexec/at-spi2-registryd &
          sleep 1

          # 5. Enable AT-SPI status properties so webkitgtk activates accessibility
          dbus-send --session --dest=org.a11y.Bus --type=method_call \
            /org/a11y/bus org.freedesktop.DBus.Properties.Set \
            string:"org.a11y.Status" string:"IsEnabled" variant:boolean:true 2>/dev/null || true
          dbus-send --session --dest=org.a11y.Bus --type=method_call \
            /org/a11y/bus org.freedesktop.DBus.Properties.Set \
            string:"org.a11y.Status" string:"ScreenReaderEnabled" variant:boolean:true 2>/dev/null || true

          # 6. Get the AT-SPI bus address and export it for the webkitgtk web process.
          # This is the critical step — without this, webkitgtk's web process silently
          # skips accessibility because it receives an empty bus address.
          A11Y_BUS=$(dbus-send --session --dest=org.a11y.Bus --print-reply \
            /org/a11y/bus org.a11y.Bus.GetAddress 2>/dev/null \
            | grep string | sed 's/.*"\(.*\)"/\1/' || true)
          if [ -n "$A11Y_BUS" ]; then
            echo "AT-SPI bus address: $A11Y_BUS"
            echo "WEBKIT_A11Y_BUS_ADDRESS=$A11Y_BUS" >> $GITHUB_ENV
            echo "AT_SPI_BUS_ADDRESS=$A11Y_BUS" >> $GITHUB_ENV
          else
            echo "WARNING: Could not get AT-SPI bus address"
          fi

          # 7. Start a minimal window manager (helps with focus management)
          fluxbox &
          sleep 1

      - name: Install xa11y
        run: pip install 'xa11y>=0.8.1,<0.9'

      - name: Install DCM (.deb)
        run: |
          DEB=$(curl -s https://downloads.deadlinecloud.amazonaws.com/manifest.json \
            | python -c "import sys,json; print(json.load(sys.stdin)['latest']['linux_deb'])")
          echo "Installing DCM from: $DEB"
          curl -sL "$DEB" -o /tmp/dcm.deb
          sudo apt-get install -y /tmp/dcm.deb

      - name: Prepare screenshot dir
        run: mkdir -p $SCREENSHOT_DIR

      - name: Run xa11y smoke tests
        run: python .github/scripts/dcm_xa11y_smoke_test.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dcm-smoke-screenshots-linux
          path: /tmp/dcm-screenshots/*.png
          if-no-files-found: ignore
